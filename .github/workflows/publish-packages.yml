name: Publish inspect-viewer packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run publish commands in dry-run mode"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify repo health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - name: Upgrade npm for trusted publishing
        run: |
          npm i -g npm@^11.5.1
          npm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repo health
        run: pnpm check

  publish-util:
    name: Publish util
    runs-on: ubuntu-latest
    needs: verify
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - name: Upgrade npm for trusted publishing
        run: |
          npm i -g npm@^11.5.1
          npm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish util (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: pnpm --filter @sjawhar/inspect-viewer-util publish --dry-run --no-git-checks --access public
      - name: Publish util
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: pnpm --filter @sjawhar/inspect-viewer-util publish --no-git-checks --access public --provenance

  publish-common-and-react:
    name: Publish common + react
    runs-on: ubuntu-latest
    needs: publish-util
    environment: npm
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@sjawhar/inspect-viewer-common"
          - "@sjawhar/inspect-viewer-react"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - name: Upgrade npm for trusted publishing
        run: |
          npm i -g npm@^11.5.1
          npm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish package (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: pnpm --filter "${{ matrix.package }}" publish --dry-run --no-git-checks --access public
      - name: Publish package
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: pnpm --filter "${{ matrix.package }}" publish --no-git-checks --access public --provenance

  publish-components:
    name: Publish components
    runs-on: ubuntu-latest
    needs: publish-common-and-react
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - name: Upgrade npm for trusted publishing
        run: |
          npm i -g npm@^11.5.1
          npm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish components (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: pnpm --filter @sjawhar/inspect-viewer-components publish --dry-run --no-git-checks --access public
      - name: Publish components
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: pnpm --filter @sjawhar/inspect-viewer-components publish --no-git-checks --access public --provenance
